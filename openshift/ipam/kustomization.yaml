apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MAPV uses the CAPI IPAM CRDs. Until CAPI reaches GA, these CRDs must be
# separately installed in production clusters. This workaround can be removed
# when CAPI reaches GA: they will be installed via the CAPI Operator manifests
# along with all other CAPI CRDs.
#
# Start serving the new v1beta2 while keeping v1beta1 as storage for rollback compatibility.
# The standalone IPAM conversion webhook handles conversion without the full CAPI manager.

commonAnnotations:
  # Boilerplate annotations
  exclude.release.openshift.io/internal-openshift-hosted: "true"
  include.release.openshift.io/self-managed-high-availability: "true"
  include.release.openshift.io/single-node-developer: "true"
  capability.openshift.io/name: ClusterAPI

  # Instructs CVO to only install these resources when the ClusterAPIMachineManagement
  # feature gate is NOT enabled.
  release.openshift.io/feature-gate: -ClusterAPIMachineManagement

  # Inject the CA for the conversion webhook.
  service.beta.openshift.io/inject-cabundle: "true"

resources:
- ../../config/crd

patches:

# Match the storage version used by the CAPI Operator manifests.
# Version order is v1alpha1 (0), v1beta1 (1), v1beta2 (2).
- target:
    kind: CustomResourceDefinition
    name: '.*\.ipam\.cluster\.x-k8s\.io$'
  patch: |
    - op: replace
      path: /spec/versions/1/storage
      value: true
    - op: replace
      path: /spec/versions/2/storage
      value: false

# Use the standalone webhook until the CAPI Operator adopts these CRDs.
- target:
    kind: CustomResourceDefinition
    name: '.*\.ipam\.cluster\.x-k8s\.io$'
  patch: |
    - op: replace
      path: /spec/conversion/webhook/clientConfig/service/name
      value: capi-ipam-conversion-webhook
    - op: replace
      path: /spec/conversion/webhook/clientConfig/service/namespace
      value: openshift-cluster-api
    - op: add
      path: /spec/conversion/webhook/clientConfig/service/port
      value: 443

# Together these 2 patches remove all CRDs except those with the name suffix
# '.ipam.cluster.x-k8s.io'. First add the local-config annotation to all CRDs.
# kustomize will not emit resources with this annotation
- target:
    kind: CustomResourceDefinition
  patch: |
    - op: "add"
      path: "/metadata/annotations/config.kubernetes.io~1local-config"
      value: "true"

# Then selectively remove the local-config annotation from CRDs in
# ipam.cluster.x-k8s.io, meaning they will be emitted
- target:
    kind: CustomResourceDefinition
    name: '.*\.ipam\.cluster\.x-k8s\.io$'
  patch: |
    - op: remove
      path: "/metadata/annotations/config.kubernetes.io~1local-config"
